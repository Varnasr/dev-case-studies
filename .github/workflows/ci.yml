name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  validate-data:
    name: Validate case-study data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate data & derived artefacts are in sync
        run: npm run validate
